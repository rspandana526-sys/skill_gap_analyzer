<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Career Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body{ background:linear-gradient(135deg,#0f2027,#203a43,#2c5364); min-height:100vh; color:white; display:flex; }
body::before{ content:""; position:fixed; width:350px; height:350px; background:#00c6ff; filter:blur(150px); top:-120px; left:-120px; opacity:0.4; pointer-events:none; z-index:0; }
body::after{ content:""; position:fixed; width:350px; height:350px; background:#ff00cc; filter:blur(150px); bottom:-120px; right:-120px; opacity:0.4; pointer-events:none; z-index:0; }

.sidebar{ width:260px; min-width:260px; height:100vh; background:rgba(10,20,35,0.85); backdrop-filter:blur(20px); border-right:1px solid rgba(255,255,255,0.08); display:flex; flex-direction:column; transition:width 0.3s ease; z-index:100; overflow:hidden; flex-shrink:0; }
.sidebar.collapsed{ width:68px; min-width:68px; }
.sidebar-header{ display:flex; align-items:center; padding:20px 16px; border-bottom:1px solid rgba(255,255,255,0.08); gap:12px; }
.hamburger{ background:none; border:none; color:white; cursor:pointer; padding:6px; border-radius:8px; display:flex; flex-direction:column; gap:5px; flex-shrink:0; transition:background 0.2s; }
.hamburger:hover{ background:rgba(255,255,255,0.1); }
.hamburger span{ display:block; width:20px; height:2px; background:white; border-radius:2px; }
.sidebar-title{ font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; opacity:1; transition:opacity 0.2s; }
.sidebar.collapsed .sidebar-title{ opacity:0; width:0; }
.sidebar-nav{ flex:1; padding:16px 10px; display:flex; flex-direction:column; gap:4px; }
.nav-item{ display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:12px; color:rgba(255,255,255,0.75); text-decoration:none; font-size:14px; font-weight:500; transition:all 0.2s; white-space:nowrap; overflow:hidden; }
.nav-item:hover{ background:rgba(255,255,255,0.1); color:white; }
.nav-item.active{ background:linear-gradient(90deg,rgba(0,198,255,0.2),rgba(0,114,255,0.15)); color:#00e5ff; border-left:3px solid #00c6ff; }
.nav-icon{ font-size:18px; flex-shrink:0; width:22px; text-align:center; }
.nav-label{ transition:opacity 0.2s; }
.sidebar.collapsed .nav-label{ opacity:0; width:0; overflow:hidden; }
.sidebar-footer{ padding:16px 10px; border-top:1px solid rgba(255,255,255,0.08); }
.logout-btn{ display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:12px; color:rgba(255,100,100,0.85); text-decoration:none; font-size:14px; font-weight:500; transition:all 0.2s; white-space:nowrap; overflow:hidden; }
.logout-btn:hover{ background:rgba(255,100,100,0.1); color:#ff6b6b; }

.main{ flex:1; display:flex; justify-content:center; padding:40px 20px; z-index:1; overflow:auto; }
.chat-card{ width:100%; max-width:780px; background:rgba(255,255,255,0.07); backdrop-filter:blur(20px); border-radius:20px; border:1px solid rgba(255,255,255,0.1); padding:30px; box-shadow:0 20px 50px rgba(0,0,0,0.4); display:flex; flex-direction:column; gap:16px; }
.chat-card h2{ font-size:24px; }
.chat-card p{ opacity:0.65; font-size:14px; }
.suggestions{ display:flex; flex-wrap:wrap; gap:8px; }
.sug-btn{ background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; padding:7px 14px; border-radius:20px; font-size:13px; cursor:pointer; transition:0.3s; font-family:'Poppins',sans-serif; }
.sug-btn:hover{ background:rgba(0,198,255,0.2); border-color:#00c6ff; }
.chat-window{ height:400px; overflow-y:auto; background:rgba(0,0,0,0.2); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth; }
.chat-window::-webkit-scrollbar{ width:5px; }
.chat-window::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.2); border-radius:10px; }
.msg{ display:flex; }
.msg.user{ justify-content:flex-end; }
.msg.bot{ justify-content:flex-start; }
.bubble{ max-width:75%; padding:12px 16px; border-radius:16px; font-size:14px; line-height:1.6; }
.msg.user .bubble{ background:linear-gradient(45deg,#00c6ff,#0072ff); border-bottom-right-radius:4px; }
.msg.bot .bubble{ background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); border-bottom-left-radius:4px; }
.typing{ display:flex; gap:5px; align-items:center; padding:14px 18px !important; }
.typing span{ width:8px; height:8px; background:#00c6ff; border-radius:50%; animation:bounce 1.2s infinite; }
.typing span:nth-child(2){ animation-delay:0.2s; }
.typing span:nth-child(3){ animation-delay:0.4s; }
@keyframes bounce{ 0%,60%,100%{ transform:translateY(0); } 30%{ transform:translateY(-6px); } }
.input-row{ display:flex; gap:10px; }
.input-row input{ flex:1; padding:13px 16px; border:none; border-radius:12px; outline:none; background:rgba(255,255,255,0.12); color:white; font-family:'Poppins',sans-serif; font-size:14px; border:1px solid rgba(255,255,255,0.15); }
.input-row input::placeholder{ opacity:0.5; }
.send-btn{ padding:13px 24px; border:none; border-radius:12px; background:linear-gradient(45deg,#00c6ff,#0072ff); color:white; font-weight:600; cursor:pointer; transition:0.3s; font-family:'Poppins',sans-serif; }
.send-btn:hover{ transform:scale(1.05); }
.send-btn:disabled{ opacity:0.5; cursor:default; transform:none; }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <button class="hamburger" onclick="toggleSidebar()">
      <span></span><span></span><span></span>
    </button>
    <span class="sidebar-title">Skill Gap Analyzer</span>
  </div>
  <nav class="sidebar-nav">
    <a href="/home"     class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="/analyze"  class="nav-item"><span class="nav-icon">🔍</span><span class="nav-label">Analyze</span></a>
    <a href="/chat"     class="nav-item active"><span class="nav-icon">🤖</span><span class="nav-label">AI Chat</span></a>
    <a href="/history"  class="nav-item"><span class="nav-icon">📋</span><span class="nav-label">History</span></a>
    <a href="/profile"  class="nav-item"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a>
  </nav>
  <div class="sidebar-footer">
    <a href="/logout" class="logout-btn"><span class="nav-icon">🚪</span><span class="nav-label">Logout</span></a>
  </div>
</div>

<div class="main">
  <div class="chat-card">
    <div>
      <h2>🤖 AI Career Advisor</h2>
      <p>Ask anything about skills, career paths, or job preparation.</p>
    </div>
    <div class="suggestions">
      <button class="sug-btn" onclick="useSuggestion(this)">What skills do I need for Data Science?</button>
      <button class="sug-btn" onclick="useSuggestion(this)">How to prepare for a Python interview?</button>
      <button class="sug-btn" onclick="useSuggestion(this)">Suggest a roadmap for ML Engineer</button>
      <button class="sug-btn" onclick="useSuggestion(this)">React vs Angular — which to learn?</button>
    </div>
    <div class="chat-window" id="chatWindow">
      <div class="msg bot">
        <div class="bubble">Hi! 👋 I'm your AI career advisor. Ask me anything about tech skills, learning paths, or interview prep.</div>
      </div>
    </div>
    <div class="input-row">
      <input type="text" id="chatInput" placeholder="Ask about skills, careers, interview tips..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('collapsed');
}
let history = [];
function useSuggestion(btn){ document.getElementById("chatInput").value = btn.textContent; sendMessage(); }
async function sendMessage(){
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if(!text) return;
  appendMsg("user", text);
  input.value = "";
  history.push({role:"user", content:text});
  const btn = document.getElementById("sendBtn");
  btn.disabled = true; btn.textContent = "...";
  const typingId = showTyping();
  try{
    const res = await fetch("/chat/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
    const data = await res.json();
    removeTyping(typingId);
    if(data.reply){ appendMsg("bot",data.reply); history.push({role:"assistant",content:data.reply}); }
    else{ appendMsg("bot","Sorry, something went wrong."); }
  }catch(e){ removeTyping(typingId); appendMsg("bot","Network error. Please check your connection."); }
  btn.disabled = false; btn.textContent = "Send";
}
function appendMsg(role,text){
  const win = document.getElementById("chatWindow");
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="bubble">${text.replace(/\n/g,"<br>")}</div>`;
  win.appendChild(div); win.scrollTop = win.scrollHeight;
}
function showTyping(){
  const id = "t"+Date.now();
  const win = document.getElementById("chatWindow");
  const div = document.createElement("div");
  div.className = "msg bot"; div.id = id;
  div.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
  win.appendChild(div); win.scrollTop = win.scrollHeight;
  return id;
}
function removeTyping(id){ const el = document.getElementById(id); if(el) el.remove(); }
</script>
</body>
</html>
