<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analyze Skills</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body{ background:linear-gradient(135deg,#0f2027,#203a43,#2c5364); min-height:100vh; color:white; display:flex; }
body::before{ content:""; position:fixed; width:350px; height:350px; background:#00c6ff; filter:blur(150px); top:-120px; left:-120px; opacity:0.4; pointer-events:none; z-index:0; }
body::after{ content:""; position:fixed; width:350px; height:350px; background:#ff00cc; filter:blur(150px); bottom:-120px; right:-120px; opacity:0.4; pointer-events:none; z-index:0; }

.sidebar{ width:260px; min-width:260px; height:100vh; background:rgba(10,20,35,0.85); backdrop-filter:blur(20px); border-right:1px solid rgba(255,255,255,0.08); display:flex; flex-direction:column; transition:width 0.3s ease; z-index:100; overflow:hidden; }
.sidebar.collapsed{ width:68px; min-width:68px; }
.sidebar-header{ display:flex; align-items:center; padding:20px 16px; border-bottom:1px solid rgba(255,255,255,0.08); gap:12px; }
.hamburger{ background:none; border:none; color:white; cursor:pointer; padding:6px; border-radius:8px; display:flex; flex-direction:column; gap:5px; flex-shrink:0; transition:background 0.2s; }
.hamburger:hover{ background:rgba(255,255,255,0.1); }
.hamburger span{ display:block; width:20px; height:2px; background:white; border-radius:2px; }
.sidebar-title{ font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; opacity:1; transition:opacity 0.2s; }
.sidebar.collapsed .sidebar-title{ opacity:0; width:0; }
.sidebar-nav{ flex:1; padding:16px 10px; display:flex; flex-direction:column; gap:4px; }
.nav-item{ display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:12px; color:rgba(255,255,255,0.75); text-decoration:none; font-size:14px; font-weight:500; transition:all 0.2s; white-space:nowrap; overflow:hidden; }
.nav-item:hover{ background:rgba(255,255,255,0.1); color:white; }
.nav-item.active{ background:linear-gradient(90deg,rgba(0,198,255,0.2),rgba(0,114,255,0.15)); color:#00e5ff; border-left:3px solid #00c6ff; }
.nav-icon{ font-size:18px; flex-shrink:0; width:22px; text-align:center; }
.nav-label{ transition:opacity 0.2s; }
.sidebar.collapsed .nav-label{ opacity:0; width:0; overflow:hidden; }
.sidebar-footer{ padding:16px 10px; border-top:1px solid rgba(255,255,255,0.08); }
.logout-btn{ display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:12px; color:rgba(255,100,100,0.85); text-decoration:none; font-size:14px; font-weight:500; transition:all 0.2s; white-space:nowrap; overflow:hidden; }
.logout-btn:hover{ background:rgba(255,100,100,0.1); color:#ff6b6b; }

.main{ flex:1; display:flex; justify-content:center; align-items:center; padding:40px; z-index:1; overflow:auto; }
.card{ width:460px; padding:40px; border-radius:20px; background:rgba(255,255,255,0.08); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.1); box-shadow:0 20px 50px rgba(0,0,0,0.4); }
.card h2{ text-align:center; margin-bottom:25px; }
form{ display:flex; flex-direction:column; gap:15px; }
label{ font-size:14px; opacity:0.9; }
label span{ font-size:12px; opacity:0.6; }
input, select{ padding:12px; border:none; border-radius:10px; outline:none; background:rgba(255,255,255,0.9); color:#111; font-family:'Poppins',sans-serif; }
small{ opacity:0.6; font-size:12px; margin-top:-8px; }
.btn{ margin-top:10px; padding:13px; border:none; border-radius:12px; background:linear-gradient(45deg,#00c6ff,#0072ff); color:white; font-weight:600; cursor:pointer; transition:0.3s; font-size:15px; }
.btn:hover{ transform:scale(1.05); }
.error{ color:#ff6b6b; text-align:center; font-size:14px; }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <button class="hamburger" onclick="toggleSidebar()">
      <span></span><span></span><span></span>
    </button>
    <span class="sidebar-title">Skill Gap Analyzer</span>
  </div>
  <nav class="sidebar-nav">
    <a href="/home"     class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="/analyze"  class="nav-item active"><span class="nav-icon">🔍</span><span class="nav-label">Analyze</span></a>
    <a href="/chat"     class="nav-item"><span class="nav-icon">🤖</span><span class="nav-label">AI Chat</span></a>
    <a href="/history"  class="nav-item"><span class="nav-icon">📋</span><span class="nav-label">History</span></a>
    <a href="/profile"  class="nav-item"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a>
  </nav>
  <div class="sidebar-footer">
    <a href="/logout" class="logout-btn"><span class="nav-icon">🚪</span><span class="nav-label">Logout</span></a>
  </div>
</div>

<div class="main">
  <div class="card">
    <h2>Analyze Your Skills</h2>
    <form method="POST" action="/analyze" enctype="multipart/form-data">
      <label>Job Role <span>(type any role — Data Scientist, Game Developer, etc.)</span></label>
      <input type="text" name="role" placeholder="e.g. Data Scientist, Blockchain Developer" required>
      <label>Enter Your Skills</label>
      <input type="text" name="skills" placeholder="python, sql, html (comma separated)">
      <label>Upload Resume <span>(optional)</span></label>
      <input type="file" name="resume" accept=".pdf,.docx,.txt">
      <small>Supported: PDF, DOCX, TXT</small>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <button class="btn">Analyze Skill Gap</button>
    </form>
  </div>
</div>

<script>
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('collapsed');
}
</script>
</body>
</html>
